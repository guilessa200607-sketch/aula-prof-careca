<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia das tags HTML</title>
</head>
<body>
    <h1>Anatomia das Tags</h1>
    <p>

        As tags HTML são os elementos básicos
        que compoem ima pagina web. Cada tag
        tem uma estrutura espicifica e desem
        penha um papel importante na organi
        zaçao e apresentaçao do conteudo.
    </p>
    <p>
        Este é um exemplo de paragrafo que pode 
        conter <strong>texto em negrito</strong> <em>texto em itálico</em>
    </p>
</body>
</html>
