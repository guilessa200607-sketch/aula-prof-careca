<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div, br e hr</title>
    
    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10;
            
        }
        #principal{
            background-color: black;
            border: 2px solid blue;
            color: gray;
        }
        #secundaria{
            background-color: cyan;
            border: 2px solid grey;
            color: rgb(14, 10, 10);

        }
        hr{
            border: none;
            border-top: 3px solid pink;
            width: 90%;
        }

    </style>
</head>
<body>
    <div id = "principal">
        Esta é  a primeria linha.
        <br>
        Esta e a segunda linha.
    </div>
    <hr>
    <div id = "secundaria">
        Esta é outra divisao da pagina.
        <br> 
        Aqui comça uma nova linha.
    </div>
</body>
</html>
